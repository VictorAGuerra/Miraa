<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0a10" />
<title>Miraa · Sala</title>
<link rel="icon" type="image/png" href="/img/favicon-512.png" sizes="512x512" />
<link rel="icon" type="image/png" href="/img/favicon-32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="/img/favicon-16.png" sizes="16x16" />
<link rel="shortcut icon" href="/img/favicon.ico" />
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="room-topbar">
    <div class="brand" style="margin-bottom:0;">
      <img src="/img/logo-white.png" alt="" class="brand-logo" style="height:24px;" />
      <h1 id="room-name" class="brand-name">Sala</h1>
    </div>
    <button class="secondary" id="leave-room-btn">Voltar ao painel</button>
  </div>

  <div class="controls">
    <button id="toggle-camera">📷 Câmera</button>
    <button id="toggle-mic">🎙️ Microfone</button>
    <button id="toggle-screen">🖥️ Compartilhar tela</button>
    <label class="checkbox">
      <input type="checkbox" id="screen-audio-checkbox" checked />
      incluir áudio do computador
    </label>
  </div>

  <div class="status-line" id="status-line">Conectando...</div>

  <div class="video-grid" id="video-grid"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
