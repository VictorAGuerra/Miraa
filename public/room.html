<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0a10" />
<title>Miraa · Sala</title>
<link rel="icon" type="image/png" href="/img/favicon-512.png" sizes="512x512" />
<link rel="icon" type="image/png" href="/img/favicon-32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="/img/favicon-16.png" sizes="16x16" />
<link rel="shortcut icon" href="/img/favicon.ico" />
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="room-topbar">
    <div class="brand" style="margin-bottom:0;">
      <img src="/img/logo-white.png" alt="" class="brand-logo" style="height:24px;" />
      <h1 id="room-name" class="brand-name">Sala</h1>
    </div>
    <button class="secondary" id="leave-room-btn">Voltar ao painel</button>
  </div>

  <div class="controls">
    <button id="toggle-camera" class="icon-btn" type="button" title="Câmera" aria-label="Câmera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="23 7 16 12 23 17 23 7"></polygon>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
      </svg>
    </button>
    <button id="toggle-mic" class="icon-btn" type="button" title="Microfone" aria-label="Microfone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <button id="toggle-screen" class="icon-btn" type="button" title="Compartilhar tela" aria-label="Compartilhar tela">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
        <line x1="8" y1="21" x2="16" y2="21"></line>
        <line x1="12" y1="17" x2="12" y2="21"></line>
        <polyline points="8 9 12 5 16 9"></polyline>
        <line x1="12" y1="5" x2="12" y2="13"></line>
      </svg>
    </button>
    <label class="checkbox">
      <input type="checkbox" id="screen-audio-checkbox" checked />
      incluir áudio do computador
    </label>
  </div>

  <div class="status-line" id="status-line">Conectando...</div>

  <div class="roster" id="roster"></div>

  <div class="video-grid" id="video-grid"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
