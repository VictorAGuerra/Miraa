<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0a10" />
<title>Miraa</title>
<link rel="icon" type="image/png" href="/img/favicon-512.png" sizes="512x512" />
<link rel="icon" type="image/png" href="/img/favicon-32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="/img/favicon-16.png" sizes="16x16" />
<link rel="shortcut icon" href="/img/favicon.ico" />
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="center-screen">
    <div class="card auth-card">
      <div class="brand">
        <img src="/img/logo-white.png" alt="" class="brand-logo" />
        <span class="brand-name">Miraa</span>
      </div>
      <p class="auth-tagline">Amigos por UUID, salas privadas e watch parties.</p>

      <form id="login-form">
        <div class="field">
          <label for="login-username">Usuário</label>
          <input type="text" id="login-username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <div class="form-actions">
          <button type="submit">Entrar</button>
          <button type="button" class="link-btn" id="show-register">Não tem conta? Cadastre-se</button>
        </div>
        <div class="error-msg" id="login-error"></div>
      </form>

      <form id="register-form" class="hidden">
        <div class="field">
          <label for="reg-username">Usuário</label>
          <input type="text" id="reg-username" autocomplete="username" minlength="3" maxlength="20" required />
        </div>
        <div class="field">
          <label for="reg-password">Senha</label>
          <input type="password" id="reg-password" autocomplete="new-password" minlength="6" required />
        </div>
        <div class="form-actions">
          <button type="submit">Criar conta</button>
          <button type="button" class="link-btn" id="show-login">Já tem conta? Entrar</button>
        </div>
        <div class="error-msg" id="register-error"></div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth-page.js"></script>
</body>
</html>
