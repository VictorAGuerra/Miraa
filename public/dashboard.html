<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0a10" />
<title>Miraa · Painel</title>
<link rel="icon" type="image/png" href="/img/favicon-512.png" sizes="512x512" />
<link rel="icon" type="image/png" href="/img/favicon-32.png" sizes="32x32" />
<link rel="icon" type="image/png" href="/img/favicon-16.png" sizes="16x16" />
<link rel="shortcut icon" href="/img/favicon.ico" />
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand" style="margin-bottom:0;">
      <img src="/img/logo-white.png" alt="" class="brand-logo" />
      <span class="brand-name">Miraa</span>
    </div>
    <div style="display:flex; align-items:center; gap:0.8rem;">
      <button class="self-trigger" id="open-profile" title="Editar perfil">
        <span id="self-avatar"></span>
        <span class="muted" id="username-label"></span>
      </button>
      <span class="uuid-chip" id="uuid-chip" title="Seu UUID — compartilhe com amigos">
        <span id="uuid-text">carregando...</span>
        <button class="icon secondary" id="copy-uuid" title="Copiar UUID">⧉</button>
      </span>
      <button class="secondary" id="logout-btn">Sair</button>
    </div>
  </div>

  <div class="layout">
    <!-- Amigos -->
    <div class="card">
      <div class="section-title"><h2>Adicionar amigo</h2></div>
      <div class="add-friend-row">
        <input type="text" id="friend-uuid-input" placeholder="Cole o UUID do seu amigo" />
        <button id="send-request-btn">Adicionar</button>
      </div>
      <div class="error-msg" id="friend-request-msg"></div>

      <div class="section-title"><h2>Pedidos recebidos</h2></div>
      <div class="list" id="incoming-list"></div>

      <div class="section-title" style="margin-top:1rem;"><h2>Pedidos enviados</h2></div>
      <div class="list" id="outgoing-list"></div>
    </div>

    <div class="card">
      <div class="section-title"><h2>Seus amigos</h2></div>
      <div class="list" id="friends-list"></div>
    </div>

    <!-- Salas -->
    <div class="card" style="grid-column: 1 / -1;">
      <div class="section-title">
        <h2>Salas privadas (watch parties)</h2>
        <button id="open-create-room">+ Criar sala</button>
      </div>
      <div class="list" id="rooms-list"></div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="create-room-modal">
    <div class="card modal">
      <div class="section-title"><h2>Nova sala</h2></div>
      <div class="field">
        <label for="room-name-input">Nome da sala</label>
        <input type="text" id="room-name-input" placeholder="Ex: Noite de filme" />
      </div>
      <label class="muted" style="font-size:0.85rem;">Convidar amigos (opcional)</label>
      <div class="friend-picker" id="room-friend-picker"></div>
      <div class="error-msg" id="create-room-error"></div>
      <div class="form-actions">
        <button id="confirm-create-room">Criar sala</button>
        <button class="secondary" id="cancel-create-room">Cancelar</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="profile-modal">
    <div class="card modal">
      <div class="section-title"><h2>Meu perfil</h2></div>
      <div class="profile-avatar-row">
        <span id="profile-avatar-preview"></span>
        <div class="profile-avatar-actions">
          <label class="link-btn" style="cursor:pointer;">
            Trocar foto
            <input type="file" id="profile-avatar-input" accept="image/png,image/jpeg,image/webp" class="hidden" />
          </label>
          <button type="button" class="secondary" id="remove-avatar-btn">Remover foto</button>
        </div>
      </div>
      <div class="field">
        <label for="profile-displayname-input">Apelido</label>
        <input type="text" id="profile-displayname-input" maxlength="30" placeholder="Como seus amigos vão te ver" />
      </div>
      <div class="error-msg" id="profile-error"></div>
      <div class="form-actions">
        <button id="save-profile-btn">Salvar</button>
        <button class="secondary" id="cancel-profile-btn">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
